name: Zoog
description: Zoog is a consumer mobile app platform that lets families create and share
  personalized video books and songs for children. Users read classic kids' stories
  or sing popular kids' songs while the app adds filters, effects, and music to produce
  custom animated videos that connect loved ones across distances. Founded in 2021
  by Yoav Oren and Matan Guttman and backed by Techstars, Zoog is used by families
  worldwide. It is a consumer product with no public developer API surface at this time.
